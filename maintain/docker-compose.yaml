services:
  rstm:
    container_name: rstm
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/rstm.me:master
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.rstm.entrypoints=web,websecure"
      - "traefik.http.routers.rstm.rule=Host(`rstm.me`)"
      - "traefik.http.routers.rstm.tls=true"
      - "traefik.http.services.rstm.loadbalancer.server.port=8080"
      - "traefik.http.routers.rstm.tls.certresolver=letsEncrypt"
  life:
    container_name: life
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/life:master
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.life.entrypoints=web,websecure"
      - "traefik.http.routers.life.rule=Host(`life.rstm.me`)"
      - "traefik.http.routers.life.tls=true"
      - "traefik.http.services.life.loadbalancer.server.port=8080"
      - "traefik.http.routers.life.tls.certresolver=letsEncrypt"
  timer:
    container_name: timer
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/timer:main
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.timer.entrypoints=web,websecure"
      - "traefik.http.routers.timer.rule=Host(`timer.rstm.me`)"
      - "traefik.http.routers.timer.tls=true"
      - "traefik.http.services.timer.loadbalancer.server.port=8080"
      - "traefik.http.routers.timer.tls.certresolver=letsEncrypt"
  wish-web:
    container_name: wish-web
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/wish-web:main
    environment:
      - API_URL=http://wish-api:8080
    depends_on:
      - wish-api
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.wish-web.entrypoints=web,websecure"
      - "traefik.http.routers.wish-web.rule=Host(`wishlist.rstm.me`)"
      - "traefik.http.routers.wish-web.tls=true"
      - "traefik.http.services.wish-web.loadbalancer.server.port=8080"
      - "traefik.http.routers.wish-web.tls.certresolver=letsEncrypt"
  wish-api:
    container_name: wish-api
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/wish-api:main
    environment:
      - RP_ID=wishlist.rstm.me
      - ORIGIN=https://wishlist.rstm.me
    env_file:
      - /opt/wish-api/.env
    volumes:
      - /opt/wish-api/data:/app/data
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.wish-api.entrypoints=web,websecure"
      - "traefik.http.routers.wish-api.rule=Host(`wishlist.rstm.me`) && PathPrefix(`/api`)"
      - "traefik.http.routers.wish-api.tls=true"
      - "traefik.http.routers.wish-api.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.wish-api.middlewares=wish-api-strip"
      - "traefik.http.middlewares.wish-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.wish-api.loadbalancer.server.port=8080"
  intervals-bridge:
    container_name: intervals-bridge
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/intervals-bridge:master
    env_file:
      - /opt/intervals-bridge/.env
    volumes:
      - /opt/intervals-bridge/allowed-athlete-ids.txt:/app/config/allowed-athlete-ids.txt:ro
      - /opt/intervals-bridge/data:/app/data
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.intervals-bridge.entrypoints=web,websecure"
      - "traefik.http.routers.intervals-bridge.rule=Host(`intervals.rstm.me`)"
      - "traefik.http.routers.intervals-bridge.tls=true"
      - "traefik.http.services.intervals-bridge.loadbalancer.server.port=8080"
      - "traefik.http.routers.intervals-bridge.tls.certresolver=letsEncrypt"
  intervals-mcp:
    container_name: intervals-mcp
    restart: unless-stopped
    image: ghcr.io/rustamyusupov/intervals-mcp:main
    env_file:
      - /opt/intervals-mcp/.env
    volumes:
      - /opt/intervals-mcp/data:/app/data
    networks:
      - traefik_rstm
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.intervals-mcp.entrypoints=web,websecure"
      - "traefik.http.routers.intervals-mcp.rule=Host(`intervals-mcp.rstm.me`)"
      - "traefik.http.routers.intervals-mcp.tls=true"
      - "traefik.http.services.intervals-mcp.loadbalancer.server.port=8080"
      - "traefik.http.routers.intervals-mcp.tls.certresolver=letsEncrypt"
  traefik:
    container_name: "traefik"
    restart: unless-stopped
    image: "traefik:v3"
    networks:
      - traefik_rstm
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsEncrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsEncrypt.acme.email=i@rstm.me"
      - "--certificatesresolvers.letsEncrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  watchtower:
    container_name: watchtower
    restart: always
    image: containrrr/watchtower
    environment:
      - DOCKER_API_VERSION=1.44
    env_file:
      - /opt/watchtower/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: --cleanup --interval 300 rstm life timer wish-web wish-api intervals-bridge intervals-mcp

networks:
  traefik_rstm:
